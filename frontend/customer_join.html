<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Preference Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0c10] text-gray-200 flex items-center justify-center min-h-screen p-4">

    <div class="bg-[#1f2833] p-8 rounded-2xl shadow-2xl max-w-md w-full border border-gray-800">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-white mb-2">Join Communication Stream</h2>
            <p class="text-sm text-gray-400">Configure your realtime alert preferences below.</p>
        </div>

        <form id="onboardingForm" class="space-y-4">
            <div>
    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Full Name</label>
    <input type="text" id="custName" required placeholder="John Doe" 
           class="w-full bg-[#0b0c10] border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-red-500 transition">
    <p id="nameError" class="text-xs text-red-500 mt-1 hidden"></p> </div>

<div>
    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Email Address</label>
    <input type="text" id="custEmail" required placeholder="john@example.com" 
           class="w-full bg-[#0b0c10] border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-red-500 transition">
    <p id="emailError" class="text-xs text-red-500 mt-1 hidden"></p> </div>

<div>
    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Phone Number</label>
    <input type="text" id="custNumber" required placeholder="9876543210" 
           class="w-full bg-[#0b0c10] border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-red-500 transition">
    <p id="numberError" class="text-xs text-red-500 mt-1 hidden"></p> </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Notification Lanes</label>
                <div class="flex items-center space-x-6 bg-[#0b0c10] p-3 rounded-lg border border-gray-700">
                    <label class="flex items-center space-x-2 cursor-pointer text-sm">
                        <input type="checkbox" id="sendEmail" checked class="accent-red-500 h-4 w-4">
                        <span>Email Alerts</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer text-sm">
                        <input type="checkbox" id="sendSms" checked class="accent-red-500 h-4 w-4">
                        <span>SMS Alerts</span>
                    </label>
                </div>
            </div>

            <button type="submit" 
                    class="w-full bg-red-600 hover:bg-red-700 text-white font-bold p-3 rounded-lg shadow-lg hover:shadow-red-900/50 transition duration-300 tracking-wide mt-2">
                Submit Preferences
            </button>
        </form>
    </div>

    <script src="customer_join.js"></script>
</body>
</html>
